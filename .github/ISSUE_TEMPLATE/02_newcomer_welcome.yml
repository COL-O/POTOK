name: "🌱 Хочу участвовать (Точка входа для энтузиаста)"
description: "Если идея ПОТОКА откликается, и ты хочешь созидать вместе с сообществом и нейросетями"
title: "[Соратник]: "
labels: ["good first issue", "newcomer"]
body:
  - type: markdown
    attributes:
      value: |
        **Добро пожаловать в ПОТОК (`COL-O/POTOK`)!** Здесь нет экзаменов и бюрократии. Творчеству открыта свободная дорога: вместе с сообществом и цифровым соратником **Синтезом** мы поможем тебе разобраться в коде и сделать первый реальный вклад.
  - type: textarea
    id: resonance
    attributes:
      label: "1. Что в идее проекта откликнулось сильнее всего?"
      placeholder: "Напиши своими словами, почему тебе важно участвовать..."
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: "2. Что ты умеешь или чему хочешь научиться?"
      placeholder: "Например: пока не знаю Go, но умею работать с нейросетями и хочу помочь с документацией / симуляцией заводов / тестами..."
    validations:
      required: true
