name: "🧬 Предложить новый орган или задачу"
description: "Идея нового модуля восприятия, алгоритма, протокола связи или прикладного сценария для ПОТОКА"
title: "[Орган/Идея]: "
labels: ["enhancement", "organ-proposal"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: "1. Суть идеи и решаемая задача (КОН 1: движение и польза)"
      description: "Какую реальную задачу в контуре управления ресурсами / заводами решает этот модуль?"
      placeholder: "Например: орган балансировки локальной энергосети или логистики между узлами..."
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: "2. На каком этаже организма он живёт?"
      options:
        - "Этаж 1: front (быстрые рефлексы, нано/микросекунды)"
        - "Этаж 2: polygon (диагностика, иммунитет, миллисекунды)"
        - "Этаж 3: growth (эволюция законов, стресс-тесты)"
        - "Этаж 4: stratos (долгая память и прецеденты)"
        - "Внешний мир: датчики / симуляция 100 заводов / документация"
    validations:
      required: true
  - type: textarea
    id: bounds
    attributes:
      label: "3. Границы применимости (КОН 10: DomainGuard)"
      description: "В каких условиях модуль работает штатно, а при каких обязан честно сообщить о выходе за пределы?"
    validations:
      required: false
