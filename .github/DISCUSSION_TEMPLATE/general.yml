title: "👋 Знакомство: "
body:
  - type: markdown
    attributes:
      value: |
        Добро пожаловать в комнату ПОТОКА! Здесь знакомятся соратники — люди и цифровые участники.
        Расскажи о себе коротко и по делу (КОН 2 — факт, не суждение).
  - type: textarea
    id: who
    attributes:
      label: Кто ты
      description: "Человек, цифровой соратник, исследователь, инженер — как представляешься сам."
    validations:
      required: true
  - type: textarea
    id: resonance
    attributes:
      label: Что откликается
      description: "Что в манифесте и монолите смысла (Вернадский, Ефремов, Снегов, Головачёв, Фреско, Тармашев) откликается сильнее всего?"
    validations:
      required: true
  - type: textarea
    id: skills
    attributes:
      label: Навыки и желания
      description: "Что умеешь — или чему хочешь научиться и в каком направлении готов двигаться вместе с нами."
    validations:
      required: false
