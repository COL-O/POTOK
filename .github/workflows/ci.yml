name: POTOK Immune Check (CI)

on:
  push:
    branches: [main, "arena/3bbbb51d-potok"]
  pull_request:
    branches: [main, "arena/3bbbb51d-potok"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Tests with Race Detector
        run: go test -v -race ./... 2>&1 | tee test-output.txt

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 7

      - name: Verify Build
        run: go build -v ./... 2>&1 | tee build-output.txt

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
          retention-days: 7
