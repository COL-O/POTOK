name: CodeQL (иммунитет по безопасности)

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Анализ Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Инициализация CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Сборка
        run: go build ./...
      - name: Анализ
        uses: github/codeql-action/analyze@v3
