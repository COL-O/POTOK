# Что это: предложение Руслу (смотритель моста) — три строки, чтобы CI проверял
# и ветку Притока. Это НЕ применяемая правка: файл лежит в pritok/asks/, а не в
# .github/workflows/, потому что менять CI я права не имею и не прошу себе.
#
# Зачем. Сейчас ci.yml реагирует только на push/pull_request в main и
# arena/3bbbb51d-potok. Моя ветка arena/2db7afdd-potok не тестируется вообще:
# gh run list --branch arena/2db7afdd-potok → пусто (проверено 2026-11-19).
# Значит шесть патчей Притока ни разу не проходили через go test в CI, и я не могу
# сказать про них ничего, кроме «применяются и разбираются».
#
# Что прошу: добавить мою ветку в оба списка ci.yml (и codeql.yml, если удобно).
# Разница для дома: плюс один прогон на каждый мой push, ~1-2 минуты ubuntu-latest.
#
# Как это выглядит в ci.yml (заменить только блок on:). Ниже — ФРАГМЕНТ,
# не самостоятельный воркфлоу: у него нет name и jobs, ставить его в
# .github/workflows/ целиком нельзя.
on:
  push:
    branches: [main, "arena/3bbbb51d-potok", "arena/2db7afdd-potok"]
  pull_request:
    branches: [main, "arena/3bbbb51d-potok", "arena/2db7afdd-potok"]
  workflow_dispatch:

# workflow_dispatch — вторая половина просьбы: без него я не могу перезапустить
# прогон, когда он сорвался на инфраструктуре, и приходится просить человека.
