# golangci-lint для ПОТОКА — версия схемы 2 (golangci-lint v2.x)
#
# Почему так, а не «включить всё»: организм — система реального времени, где
# важнее всего гонки, утечки ресурсов и необработанные ошибки, а не длина строк.
# Поэтому включены линтеры, которые ловят поведение, и намеренно выключены
# стилевые (lll, godot, varnamelen, exhaustruct): они дают много шума и ничего
# не говорят о том, жив ли организм.
#
# Проверено против официальной JSON-схемы схемы v2 (jsonschema/golangci.jsonschema.json):
# все ключи ниже существуют, ни один не устарел. Сам прогон линтера не делался —
# golangci-lint в песочнице нет; первым это увидит CI.

version: "2"

run:
  # go.mod требует 1.21; таймаут нужен, потому что на холодную первый прогон
  # с typecheck всех пакетов идёт десятки секунд.
  timeout: 5m
  tests: true

linters:
  # По умолчанию только стандартный набор (errcheck, govet, ineffassign,
  # staticcheck, unused) — остальное включаем осознанно.
  default: standard
  enable:
    # поведение
    - bodyclose        # resp.Body не закрыт — классическая утечка в HTTP-дашборде
    - contextcheck     # context не проброшен дальше — теряются отмены
    - noctx            # HTTP-запрос без context
    - rowserrcheck     # rows.Err() не проверен
    - sqlclosecheck    # забытый Close() у соединений
    - errorlint        # сравнение ошибок через == вместо errors.Is/As
    - nilerr           # вернули nil вместо ошибки
    - nilnesserr       # проверка не той ошибки на nil
    - copyloopvar      # замыкание захватило переменную цикла (Go < 1.22)
    - durationcheck    # перемноженные time.Duration
    - makezero         # append в слайс с ненулевой длиной
    - wastedassign     # присвоили и не использовали
    - unconvert        # лишние приведения типов
    - usestdlibvars    # свои константы вместо http.MethodGet и т.п.
    # безопасность
    - gosec
    # конкурентность и «мёртвое»
    - unparam          # параметр, который всегда один и тот же
  settings:
    errcheck:
      # В доме есть места, где ошибку гасят осознанно (закрытие в defer,
      # запись в журнал) — такие пишутся явно через `_ =`, и этого достаточно.
      check-type-assertions: true
      check-blank: false
    gosec:
      excludes:
        # G304: путь к файлу из переменной — в stratos/store.go путь приходит
        # из конфигурации, это не пользовательский ввод.
        - G304
    govet:
      enable-all: true
      disable:
        # fieldalignment — микрооптимизация раскладки структур; в коде шины
        # порядок полей выбран под кэш-линии осознанно, линтер об этом не знает.
        - fieldalignment
    staticcheck:
      checks:
        - all
        - -ST1000  # «нет комментария к пакету» — шум на старте, не поведение
        - -ST1003  # имена с подчёркиванием: в контрактах принято осознанно
  exclusions:
    generated: strict
    rules:
      # Тесты вправе быть прямее кода: там допустимы длинные функции,
      # повторы и «магические» числа как часть сценария.
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - errcheck
      # flat/ — вложенный модуль из скриптов развёртывания; он собирается
      # отдельно и не развивается. Его чинить бессмысленно, пока живо modules/.
      - path: ^flat/
        linters:
          - gosec
          - errcheck
          - staticcheck
          - govet

formatters:
  enable:
    - gofmt
    # goimports не включён: он спорит с порядком импортов, принятым в доме.

issues:
  # Показывать максимум, чтобы в первом прогоне увидеть всю картину, а не порцию.
  max-issues-per-linter: 0
  max-same-issues: 0
