apiVersion: apps/v1
kind: Deployment
metadata:
  name: organism-core
  labels:
    app: organism
spec:
  replicas: 3
  selector:
    matchLabels:
      app: organism
  template:
    metadata:
      labels:
        app: organism
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: organism
          image: organism:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: udp-gateway
              containerPort: 9000
              protocol: UDP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - IPC_LOCK
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /prometheus
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: stratos-wal
              mountPath: /var/lib/organism/stratos
      volumes:
        - name: stratos-wal
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: organism-service
spec:
  selector:
    app: organism
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
