apiVersion: v1
kind: PersistentVolume
metadata:
  name: organism-wal-pv-0
  labels:
    app: organism
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nvme
  local:
    path: /mnt/nvme/organism-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node-1
